<svg width="220" height="136" viewBox="0 0 220 136" fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img" aria-label="Open V0 Visualizer"
  shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="220" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F18"/>
      <stop offset="1" stop-color="#07090F"/>
    </linearGradient>

    <radialGradient id="glow1" cx="48" cy="42" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="topShine" x1="110" y1="0" x2="110" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#34D399" stop-opacity="0.11"/>
      <stop offset="0.5" stop-color="#34D399" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow2" cx="188" cy="26" r="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.055"/>
      <stop offset="0.55" stop-color="#34D399" stop-opacity="0.018"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentLine" x1="0" y1="0.5" x2="220" y2="0.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.04" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.1" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="0.2" stop-color="#34D399" stop-opacity="0.55"/>
      <stop offset="0.34" stop-color="#34D399" stop-opacity="0.88"/>
      <stop offset="0.5" stop-color="#34D399" stop-opacity="1"/>
      <stop offset="0.66" stop-color="#34D399" stop-opacity="0.88"/>
      <stop offset="0.8" stop-color="#34D399" stop-opacity="0.55"/>
      <stop offset="0.9" stop-color="#34D399" stop-opacity="0.18"/>
      <stop offset="0.96" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>

    <filter id="accentBloom" x="-12%" y="-500%" width="124%" height="1100%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.5"/>
    </filter>

    <mask id="cardMask">
      <rect width="220" height="136" rx="20" fill="white"/>
    </mask>
  </defs>

  <g mask="url(#cardMask)">
    <rect width="220" height="136" fill="url(#bg)"/>
    <rect width="220" height="52" fill="url(#topShine)"/>
    <rect width="220" height="136" fill="url(#glow1)"/>
    <rect width="220" height="136" fill="url(#glow2)"/>
    <!-- Decorative orbit -->
    <g transform="translate(176,-26)" opacity="0.08">
      <circle cx="24" cy="24" r="52" fill="none" stroke="#34D399" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="38" fill="none" stroke="#34D399" stroke-width="0.6"/>
      <circle cx="24" cy="24" r="24" fill="none" stroke="#34D399" stroke-width="0.6"/>
      <circle cx="24" cy="24" r="5" fill="#34D399" opacity="0.55"/>
    </g>

    <!-- Icon tile -->
    <rect x="20" y="22" width="46" height="46" rx="14" fill="#08111A" stroke="rgba(255,255,255,0.06)"/>
    <rect x="27" y="29" width="32" height="32" rx="10" fill="rgba(52,211,153,0.09)" stroke="rgba(52,211,153,0.18)"/>

    <text x="43" y="50"
      text-anchor="middle"
      fill="#34D399"
      font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,sans-serif"
      font-size="15"
      font-weight="900"
      letter-spacing="-0.4"
    >V0</text>

    <!-- Small label -->
    <g transform="translate(78,27)">
      <circle cx="5" cy="5" r="3" fill="#34D399"/>
      <text x="15" y="8"
        fill="#34D399"
        font-family="'SF Mono','Cascadia Code','Fira Code',Consolas,monospace"
        font-size="9"
        font-weight="700"
        letter-spacing="1.2"
      >VISUALIZER</text>
    </g>

    <!-- Main copy -->
    <text x="20" y="92"
      fill="#EDF2F8"
      font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,sans-serif"
      font-size="20"
      font-weight="800"
      letter-spacing="-0.35"
    >Open V0</text>

    <text x="20" y="112"
      fill="#697A8D"
      font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,sans-serif"
      font-size="13"
      font-weight="600"
    >Music dashboard</text>

    <!-- Arrow button -->
    <g transform="translate(174,92)">
      <rect x="0" y="0" width="28" height="28" rx="14" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.16)"/>
      <path d="M10 9H19V18" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18.5 9.5L9 19" stroke="#34D399" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <line x1="20" y1="121" x2="202" y2="121" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <rect width="220" height="136" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="20" y1="0.5" x2="200" y2="0.5" stroke="url(#accentLine)" stroke-width="3.5" stroke-linecap="butt" opacity="0.65" filter="url(#accentBloom)"/>
    <line x1="20" y1="0.5" x2="200" y2="0.5" stroke="url(#accentLine)" stroke-width="1.5" stroke-linecap="butt" opacity="0.95"/>
  </g>
</svg>
